<script type="text/javascript">
    RED.nodes.registerType('eventhub-recv', {
        category: 'input',
        color: '#0080FF',
        defaults: {
            name: { value: "" },
            eventhub: { value: "", type: "eventhub-config" },
            consumergroup: { value: "$default" },
            connectionstringType: { value: "cred" },
            consumergroupType: { value: "str" },
        },
        credentials: {
            connectionstring: { type: "text" },
        },
        inputs: 0,
        outputs: 4,
        outputLabels: ["message", "error", "connect", "close"],
        icon: "eventhub.png",
        label: function () {
            return this.name || "event-hub";
        },
        oneditprepare: function () {
            // Open the legacy section when it's actually in use (no config
            // node selected and an inline connection string is set).
            if (!this.eventhub && $('#node-input-connectionstring').val()) {
                $('#node-input-legacy').attr('open', 'open');
            }
            $('#node-input-connectionstring').typedInput({
                typeField: "#node-input-connectionstringType",
                default: this.connectionstringType,
                types: ['str', 'env', 'cred', 'flow', 'global'],
            });
            $('#node-input-consumergroup').typedInput({
                typeField: "#node-input-consumergroupType",
                default: this.consumergroupType,
                types: ['str', 'env', 'flow', 'global'],
            });
        },
    });
</script>

<script type="text/x-red" data-template-name="eventhub-recv">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-eventhub"><i class="icon-tag"></i> Event Hub Config</label>
        <input type="text" id="node-input-eventhub">
    </div>
    <details id="node-input-legacy">
        <summary><i class="icon-tag"></i> <em>Legacy (inline connection)</em></summary>
        <p class="form-tips" style="margin: 0 0 4px 0;">Prefer an <code>eventhub-config</code> node above; these fields are only used when none is selected.</p>
        <div class="form-row">
            <label for="node-input-connectionstring"><i class="icon-tag"></i> Event Hub Connection String</label>
            <input type="hidden" id="node-input-connectionstringType">
            <input type="text" id="node-input-connectionstring" placeholder="E.g. Endpoint=sb://XXX.servicebus.windows.net/;SharedAccessKeyName=XXX;SharedAccessKey=XXX;EntityPath=XXX">
        </div>
        <div class="form-row">
            <label for="node-input-consumergroup"><i class="icon-tag"></i> Consumer Group</label>
            <input type="hidden" id="node-input-consumergroupType">
            <input type="text" id="node-input-consumergroup" placeholder="$default">
        </div>
    </details>
</script>

<script type="text/x-red" data-help-name="eventhub-recv">
    <p>A node that receives messages from an Azure Event Hub...</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        There are no inputs. Messages are received on deploy.
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Message
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt>
                <dd>The received message body.</dd>
                <dt>context <span class="property-type">object</span></dt>
                <dd>Partition context: <code>partitionId</code>, <code>eventHubName</code>, <code>consumerGroup</code>, <code>fullyQualifiedNamespace</code>.</dd>
                <dt>processTimeUtc <span class="property-type">date</span></dt>
                <dd>When the message was processed.</dd>
            </dl>
            Message metadata (offset, sequenceNumber, enqueuedTimeUtc, properties, systemProperties, ...) is included alongside the payload.
        </li>
        <li>Error
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt>
                <dd><code>{ name, message, code }</code> describing a partition processing error.</dd>
            </dl>
        </li>
        <li>Connect
            <dl class="message-properties">
                <dt>payload.status <span class="property-type">string</span></dt>
                <dd><code>"connected"</code> when a partition is claimed.</dd>
            </dl>
        </li>
        <li>Close
            <dl class="message-properties">
                <dt>payload.status <span class="property-type">string</span></dt>
                <dd><code>"closed"</code> when a partition is released.</dd>
                <dt>payload.reason <span class="property-type">string</span></dt>
                <dd>Why the partition was closed.</dd>
            </dl>
        </li>
    </ol>
    
    <h3>Details</h3>
    The Event Hub Config property specifies an <code>eventhub-config</code> node
    that contains the connection string and consumer group. When set, it takes
    precedence over the legacy inline connection string and consumer group
    fields below.

    <h3>References</h3>
    <ul>
        <li><a href="https://azure.microsoft.com/en-us/services/event-hubs/">Azure Event Hubs</a></li>
        <li><a href="https://github.com/Azure/azure-sdk-for-js/tree/main/sdk/eventhub/event-hubs">Azure Event Hubs client library for JS</a> - the client library used by this node</li>
    </ul>
</script>

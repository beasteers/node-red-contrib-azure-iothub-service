<script type="text/javascript">
    RED.nodes.registerType('eventhub-config', {
        category: 'config',
        defaults: {
            name: { value: "" },
            consumergroup: { value: "$default" },
            connectionstringType: { value: "cred" },
            consumergroupType: { value: "str" },
        },
        credentials: {
            connectionstring: { type: "text" },
        },
        label: function () {
            return this.name || "eventhub-config";
        },
        oneditprepare: function () {
            $('#node-config-input-connectionstring').typedInput({
                typeField: "#node-config-input-connectionstringType",
                default: this.connectionstringType,
                types: ['str', 'env', 'cred', 'flow', 'global'],
            });
            $('#node-config-input-consumergroup').typedInput({
                typeField: "#node-config-input-consumergroupType",
                default: this.consumergroupType,
                types: ['str', 'env', 'flow', 'global'],
            });
        },
    });
</script>

<script type="text/x-red" data-template-name="eventhub-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-config-input-connectionstring"><i class="icon-tag"></i> Event Hub Connection String</label>
        <input type="hidden" id="node-config-input-connectionstringType">
        <input type="text" id="node-config-input-connectionstring" placeholder="E.g. Endpoint=sb://XXX.servicebus.windows.net/;SharedAccessKeyName=XXX;SharedAccessKey=XXX;EntityPath=XXX">
    </div>
    <div class="form-row">
        <label for="node-config-input-consumergroup"><i class="icon-tag"></i> Consumer Group</label>
        <input type="hidden" id="node-config-input-consumergroupType">
        <input type="text" id="node-config-input-consumergroup" placeholder="$default">
    </div>
</script>

<script type="text/x-red" data-help-name="eventhub-config">
    <p>Configuration node for an Azure Event Hub connection.</p>
    <h3>Details</h3>
    <p>Stores the Event Hub connection string and consumer group. Event Hub receive nodes refer to this configuration to share credentials across multiple nodes.</p>
</script>

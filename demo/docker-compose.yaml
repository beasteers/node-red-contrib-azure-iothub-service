services:
  emulator:
    container_name: "eventhubs-emulator-demo"
    image: "mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest"
    pull_policy: always
    volumes:
      - "../test/emulator/config.json:/Eventhubs_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "9092:9092"
      - "5300:5300"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"
    depends_on:
      - azurite
    networks:
      eh-emulator:
        aliases:
          - "eventhubs-emulator"
  azurite:
    container_name: "azurite-demo"
    image: "mcr.microsoft.com/azure-storage/azurite:latest"
    pull_policy: always
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      eh-emulator:
        aliases:
          - "azurite"
  nodered:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    container_name: "nodered-eventhub-demo"
    depends_on:
      - emulator
    environment:
      # Resolved by the flow from the "env" typed field; the emulator accepts
      # any SAS key, so there is nothing secret here. Point this at a real
      # Event Hub to use the demo against Azure.
      EVENTHUB_CONNECTION_STRING: "Endpoint=sb://eventhubs-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;EntityPath=eh1"
    ports:
      - "${NODERED_PORT:-1880}:1880"
    volumes:
      - "./data:/data"
      - "../lib:/usr/src/node-red/module/lib"
    networks:
      eh-emulator:
networks:
  eh-emulator:
